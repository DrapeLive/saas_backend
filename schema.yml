      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by agent full name, email or employee code.
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by membership status: pending | reviewed | active | suspended
          | removed.'
      tags:
      - Agents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentMembershipList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Bad request. Field/validation errors are flattened into a single
            `detail` string.
