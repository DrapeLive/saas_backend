      tags:
      - Tally Integration
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Not found. The requested resource does not exist in the current
            company.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Forbidden. The authenticated user is not allowed to perform
            this action.
  /api/tally/logs/:
    get:
      operationId: tally_logs_list
      description: Company-scoped sync ledger (latest 200 entries).
      summary: List sync logs
      parameters:
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - pull
          - push
        description: Filter by sync direction.
      - in: query
        name: entity_type
        schema:
          type: string
        description: Filter by entity type.
      - in: query
        name: status
