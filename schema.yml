                  $ref: '#/components/schemas/TallySyncLogList'
          description: ''
  /api/tally/logs/{id}/:
    get:
      operationId: tally_logs_retrieve
      summary: Get sync log
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Tally Integration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallySyncLogDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Not found. The requested resource does not exist in the current
            company.
  /api/tally/retry/:
    post:
      operationId: tally_retry_create
      description: Re-queues one or more failed sync logs. Admin only.
      summary: Retry failed syncs
      tags:
      - Tally Integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TallySyncRetryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TallySyncRetryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TallySyncRetryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Success.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Bad request. Field/validation errors are flattened into a single
            `detail` string.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Forbidden. The authenticated user is not allowed to perform
            this action.
  /api/tally/status/:
    get:
      operationId: tally_status_retrieve
      summary: Sync health summary
