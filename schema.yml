  /api/orders/{id}/pack-items/:
    post:
      operationId: packOrderItems
      description: |-
        Bulk-records how many units of each line item were physically packed. Packed quantity may be **equal to or less than** the ordered quantity — partial packing / shortfalls are expected and over-packing is rejected.

        - Every `item_id` must belong to this order.
        - Allowed until the order is dispatched, delivered or cancelled.
        - The order-level `packing_status` (unpacked / partially_packed / packed) is **auto-derived** from its items; there is no separate 'mark as packed' call.
        - Each change is appended to the order's status history for audit.
      summary: Record packed quantities per item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackItemsRequest'
            examples:
              PartialPacking(ordered100,Packed80):
                value:
                  items:
                  - item_id: 6a3f8b2c-1d4e-4f5a-9b0c-7d8e6f5a4b3c
                    packed_quantity: 80
                  notes: 20 units short-packed
                summary: Partial packing (ordered 100, packed 80)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PackItemsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PackItemsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '400':
          description: Validation failed — over-packing, foreign/unknown item, duplicates,
            or a terminal order status.
        '403':
          description: Only Admin / SubAdmin may record packed quantities.
        '404':
          description: Order not found in your company.
