      - entity_type
      - id
      - updated_at
    TallySyncLogList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          $ref: '#/components/schemas/TallyDirectionEnum'
        entity_type:
          type: string
          maxLength: 50
        entity_id:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/TallySyncStatusEnum'
        retry_count:
          type: integer
        synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - direction
      - entity_type
      - id
    TallySyncRetryRequest:
      type: object
      description: Retry one or more failed sync log entries.
      properties:
        log_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
          minItems: 1
      required:
      - log_ids
    TallySyncStatusEnum:
      enum:
      - synced
      - pending
      - failed
      type: string
      description: |-
        * `synced` - synced
        * `pending` - pending
        * `failed` - failed
    TallySyncStatusSummary:
      type: object
      description: Read-only sync health summary for the Tally settings page.
      properties:
        total_synced:
          type: integer
        total_pending:
          type: integer
        total_failed:
          type: integer
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
      required:
      - last_error
      - last_synced_at
      - total_failed
      - total_pending
      - total_synced
    TallySyncTriggerRequest:
      type: object
      description: |-
        Manually trigger a Tally sync for a specific entity.
        Queues a Celery task.
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          format: uuid
          description: Required for all entity types except 'all'.
        direction:
          allOf:
          - $ref: '#/components/schemas/TallyDirectionEnum'
          default: push
      required:
      - entity_type
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TopAgent:
      type: object
      properties:
        image:
          type: string
          nullable: true
        name:
          type: string
        number_of_orders_today:
          type: integer
        total_order_payment_today:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
      required:
      - image
      - name
      - number_of_orders_today
      - total_order_payment_today
    TrialExtensionResponse:
      type: object
      properties:
        detail:
          type: string
        trial_end:
          type: string
          format: date
          nullable: true
      required:
      - detail
      - trial_end
    TypeEnum:
      enum:
      - follow_up
      - agent_note
      type: string
      description: |-
        * `follow_up` - follow_up
        * `agent_note` - agent_note
    UpcomingPayment:
      type: object
      properties:
        invoice_id:
          type: string
        invoice_number:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        due_date:
          type: string
          format: date
        days_overdue:
          type: integer
      required:
      - amount
      - days_overdue
      - due_date
      - invoice_id
      - invoice_number
    UsageSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        snapshot_month:
          type: string
          format: date
          description: First day of the month
        agent_count:
          type: integer
        customer_count:
          type: integer
        product_count:
          type: integer
        order_count:
          type: integer
        storage_used_mb:
          type: number
          format: double
      required:
      - id
      - snapshot_month
    UserAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        role:
          $ref: '#/components/schemas/RoleEnum'
        company:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - last_login
      - role
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        company_name:
          type: string
          nullable: true
          readOnly: true
        company_status:
          type: string
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - company_name
      - company_status
      - created_at
      - email
      - full_name
      - id
      - is_active
      - role
      - updated_at
    VariantSize:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        size:
          type: string
          maxLength: 20
        sku:
          type: string
          maxLength: 60
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        stock_quantity:
          type: integer
        reserved_qty:
          type: integer
          description: Reserved for pending orders
        available_qty:
          type: integer
          readOnly: true
        reorder_level:
          type: integer
        is_low_stock:
          type: boolean
          readOnly: true
        is_active:
          type: boolean
      required:
      - available_qty
      - id
      - is_low_stock
      - size
      - sku
    VariantSizeCreateRequest:
      type: object
      properties:
        size:
          type: string
          minLength: 1
          maxLength: 20
        sku:
          type: string
          minLength: 1
          maxLength: 60
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        stock_quantity:
          type: integer
        reorder_level:
          type: integer
        is_active:
          type: boolean
      required:
      - size
      - sku
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
tags:
- name: Authentication
  description: Login, signup, token refresh, logout, password and agent onboarding.
- name: Accounts
  description: Company users, sub-admins, invitations and the company setup wizard.
- name: Companies
  description: Super-admin lifecycle management of tenant companies.
- name: Agents
  description: Agent memberships, approvals, performance and leaderboards.
- name: Customers
  description: Customer profiles, documents, communication logs and customer analytics.
- name: Products
  description: Products, color variants, QR scans and inventory listings.
- name: Categories
  description: Hierarchical product categories.
- name: Size Charts
  description: Reusable size charts attached to products.
- name: Stock
  description: Stock movement ledger and manual adjustments.
- name: Orders
  description: Orders, workflow status, packing, approvals, offline sync and signatures.
- name: Dispatch
  description: Dispatch records and delivery confirmation.
- name: Invoices
  description: Invoices, credit/debit notes, voiding and PDF download.
- name: Payments
  description: Payments, outstanding aging reports and payment reminders.
- name: Plans
  description: Subscription pricing tiers managed by the super-admin.
- name: Subscriptions
  description: Company subscriptions, upgrades, extensions and usage.
- name: Commissions
  description: Commission plans, slabs, category rates and entry settlement.
- name: Notifications
  description: Notification templates and dispatch records.
- name: Audit Logs
  description: Read-only audit trail of company activity.
- name: Tally Integration
  description: Tally sync logs, ledger mappings and connection actions.
- name: Admin
  description: Company admin dashboards, analytics and business stats.
- name: Super Admin
  description: Platform-level dashboard.
