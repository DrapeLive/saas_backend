openapi: 3.0.3
info:
  title: Drape SaaS API
  version: 1.0.0
  description: |-
    REST API for the Drape SaaS platform — a multi-tenant textile wholesale management suite covering customers, products, inventory, orders, dispatch, invoicing, payments, commissions and Tally sync.

    ### Authentication
    All endpoints except **Authentication** (login / signup / refresh / password reset) require a bearer token:

        Authorization: Bearer <access-token>

    Obtain a token pair from `POST /api/auth/login` or `POST /api/auth/signup`. Access tokens expire after 24 hours; use `POST /api/auth/refresh` to renew. Click **Authorize** and paste the access token to enable "Try it out" on authenticated endpoints.

    ### Company scoping
    Every business endpoint is scoped to a single tenant company. The company is resolved from the JWT `company_id` claim. Agents whose token carries no `company_id` claim may select a company by sending the `X-Company-Id` header (must match an active membership).

    ### Roles
    `superadmin` — platform operator only. `admin` — company owner. `subadmin` — company staff. `agent` — field sales agent. `customer` — customer portal (not exposed by this API).

    ### Errors
    All error responses share a flat envelope returned by the global exception handler:

        {\"detail\": \"Human-readable error message.\"}

    Status codes: `400` validation / business-rule failure, `401` missing or invalid token, `403` forbidden role, `404` not found in the current company, `409` conflict, `429` rate limited.
paths:
  /api/admin/agents:
    get:
      operationId: admin_agents_list
      description: 'Company admin/sub-admin: lists agent memberships for the caller''s
        company, newest first. Paginated; supports `status`, `search`, `page` and
        `page_size`.'
      summary: List agent memberships
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by agent full name, email or employee code.
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter by membership status: pending | reviewed | active | suspended
          | removed.'
      tags:
      - Agents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentMembershipList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: Bad request. Field/validation errors are flattened into a single
            `detail` string.
