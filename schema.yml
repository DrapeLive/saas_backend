components:
  schemas:
    ActivityEntry:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        channel:
          type: string
        text:
          type: string
          default: ''
        subject:
          type: string
          default: ''
        date:
          type: string
          format: date
      required:
      - channel
      - date
      - type
    Address:
      type: object
      properties:
        line1:
          type: string
          default: ''
        line2:
          type: string
          default: ''
        city:
          type: string
          default: ''
        state:
          type: string
          default: ''
        pincode:
          type: string
          default: ''
        same_as_billing:
          type: boolean
          default: true
    AdminAnalytics:
      type: object
      properties:
        sales_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        top_products:
          type: array
          items:
            type: object
            additionalProperties: {}
        agent_comparison:
          type: array
          items:
            type: object
            additionalProperties: {}
        outstanding_aging:
          type: object
          additionalProperties: {}
        customer_acquisition:
          type: object
          additionalProperties: {}
      required:
      - agent_comparison
      - customer_acquisition
      - outstanding_aging
      - sales_trend
      - top_products
    AdminDashboard:
      type: object
      properties:
        sales_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        orders_pending:
          type: integer
        outstanding_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        overdue_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        receivables_ageing:
          $ref: '#/components/schemas/ReceivablesAgeing'
        tally_sync:
          $ref: '#/components/schemas/TallySync'
      required:
      - orders_pending
      - outstanding_total
      - overdue_total
      - receivables_ageing
      - sales_total
      - tally_sync
    AgentCommissionSummary:
      type: object
      description: Read-only summary per agent for the commission dashboard.
      properties:
        agent_id:
          type: string
          format: uuid
        agent_name:
          type: string
        pending_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        approved_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        disputed_count:
          type: integer
        period:
          type: string
          format: date
      required:
      - agent_id
      - agent_name
      - approved_amount
      - disputed_count
      - paid_amount
      - pending_amount
      - period
    AgentCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type: string
          format: uri
          readOnly: true
        membership_id:
          type: string
          format: uuid
        membership_status:
          type: string
        territory:
          type: string
        order_count:
          type: integer
          default: 0
      required:
      - id
      - logo
      - membership_id
      - membership_status
      - name
      - territory
    AgentInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        token:
          type: string
        status:
          $ref: '#/components/schemas/InvitationStatusEnum'
        max_uses:
          type: integer
        used_count:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - expires_at
      - id
      - max_uses
      - phone
      - status
      - token
      - used_count
    AgentInvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 15
        max_uses:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
    AgentJoinRequest:
      type: object
      properties:
        invite_code:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - invite_code
    AgentLeaderboard:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        territory:
          type: string
        orders_this_month:
          type: integer
        sales_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        rank:
          type: integer
      required:
      - agent_id
      - email
      - full_name
      - orders_this_month
      - phone
      - rank
      - sales_this_month
      - territory
    AgentMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        agent_id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/AgentUser'
          readOnly: true
        company_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AgentMembershipStatusEnum'
          readOnly: true
        territory:
          type: string
          maxLength: 200
        clients_count:
          type: integer
          readOnly: true
          default: 0
        commission_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          default: '0.00'
        commission_pending:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          default: '0.00'
        monthly_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        custom_commission_plan:
          type: string
          format: uuid
          nullable: true
        commission_plan_name:
          type: string
          readOnly: true
        invitation_method:
          allOf:
          - $ref: '#/components/schemas/InvitationMethodEnum'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        removed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_id
      - approved_by
      - clients_count
      - commission_pending
      - commission_plan_name
      - commission_total
      - company_name
      - created_at
      - id
      - invitation_method
      - joined_at
      - removed_at
      - reviewed_at
      - reviewed_by
      - status
      - updated_at
      - user
    AgentMembershipRequest:
      type: object
      properties:
        territory:
          type: string
          maxLength: 200
        monthly_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        custom_commission_plan:
          type: string
          format: uuid
          nullable: true
    AgentMembershipStatusEnum:
      enum:
      - pending
      - reviewed
      - active
      - suspended
      - removed
      type: string
      description: |-
        * `pending` - Pending Approval
        * `reviewed` - Reviewed by Sub Admin
        * `active` - Active
        * `suspended` - Suspended
        * `removed` - Removed
    AgentOverview:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/AgentOverviewSummary'
        recent_payouts:
          type: array
          items:
            $ref: '#/components/schemas/RecentPayout'
      required:
      - recent_payouts
      - summary
    AgentOverviewSummary:
      type: object
      properties:
        active_agents:
          type: integer
        pending_payout_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        paid_payout_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - active_agents
      - paid_payout_amount
      - pending_payout_amount
    AgentPerformance:
      type: object
      properties:
        orders_this_month:
          type: integer
        sales_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        commission_earned:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        commission_preview:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        leaderboard_rank:
          type: integer
          nullable: true
        target_vs_actual:
          type: number
          format: double
          nullable: true
        monthly_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - commission_earned
      - commission_preview
      - leaderboard_rank
      - monthly_target
      - orders_this_month
      - sales_this_month
      - target_vs_actual
    AgentRegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          maxLength: 15
      required:
      - email
      - full_name
      - password
    AgentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        is_active:
          type: boolean
      required:
      - email
      - full_name
      - id
    AgentUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          maxLength: 15
        is_active:
          type: boolean
      required:
      - email
      - full_name
    AgingBucket:
      type: object
      properties:
        bucket:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        percentage:
          type: number
          format: double
      required:
      - amount
      - bucket
      - percentage
    AgingReportSummary:
      type: object
      description: Aggregated aging across all customers — for the dashboard aging
        widget.
      properties:
        total_outstanding:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        current:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        days_1_30:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        days_31_60:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        days_61_90:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        days_90_plus:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        customers_overdue:
          type: integer
      required:
      - current
      - customers_overdue
      - days_1_30
      - days_31_60
      - days_61_90
      - days_90_plus
      - total_outstanding
    AuditLogDetail:
      type: object
      description: Full detail including old/new value diff.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          readOnly: true
        user_role:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 100
        entity_id:
          type: string
          format: uuid
          nullable: true
        old_value:
          nullable: true
        new_value:
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - company_name
      - created_at
      - id
      - user_email
      - user_name
    AuditLogList:
      type: object
      description: Lightweight — used in the audit trail table.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_role:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 100
        entity_id:
          type: string
          format: uuid
          nullable: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - company_name
      - created_at
      - id
      - user_name
    BillingCycleEnum:
      enum:
      - monthly
      - yearly
      - trial
      type: string
      description: |-
        * `monthly` - Monthly
        * `yearly` - Yearly
        * `trial` - Trial
    BlankEnum:
      enum:
      - ''
    BusinessStats:
      type: object
      properties:
        total_customers:
          type: integer
        overdue_customers:
          type: integer
        overdue_invoices:
          type: integer
        total_agents:
          type: integer
        active_agents_today:
          type: integer
        outstanding_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        overdue_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
