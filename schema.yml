components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    AdminAnalytics:
      type: object
      properties:
        sales_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        top_products:
          type: array
          items:
            type: object
            additionalProperties: {}
        agent_comparison:
          type: array
          items:
            type: object
            additionalProperties: {}
        outstanding_aging:
          type: object
          additionalProperties: {}
        customer_acquisition:
          type: object
          additionalProperties: {}
      required:
      - agent_comparison
      - customer_acquisition
      - outstanding_aging
      - sales_trend
      - top_products
    AdminDashboard:
      type: object
      properties:
        sales_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        orders_pending:
          type: integer
        outstanding_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        overdue_total:
          type: string
