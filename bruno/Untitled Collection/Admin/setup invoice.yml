info:
  name: setup invoice
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{BASE_URL}}/admin/setup/invoice"
  body:
    type: json
    data: |-
      {
        "invoice_prefix": "company",
        "po_prefix": "jej",
        "financial_year_start": "2025-02-12"
      }
  auth:
    type: bearer
    token: "{{access_admin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
