info:
  name: password change
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/auth/password/change"
  body:
    type: json
    data: |-
      {
        "old_password": "password",
        "new_password": "Password123456"
      }
  auth:
    type: bearer
    token: "{{access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
