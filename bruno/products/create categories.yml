info:
  name: create categories
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/categories/"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Women's Kids Wear
        contentType: Text
      - name: slug
        type: text
        value: womens-kids-wear
      - name: description
        type: text
        value: Womens's Kids collection
      - name: image
        type: file
        value:
          - /home/muflih/Pictures/git_profile.jpg
        contentType: image/jpeg
      - name: display_order
        type: text
        value: "3"
      - name: is_active
        type: text
        value: "true"
      - name: default_commission_pct
        type: text
        value: "1"
      - name: parent
        type: text
        value: 236280a8-6787-474a-ae56-a7ca32956508
  auth:
    type: bearer
    token: "{{access_admin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
