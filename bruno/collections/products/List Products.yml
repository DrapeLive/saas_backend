info:
  name: List Products
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/products/"
  headers:
    - name: X-Company-Id
      value: "{{COMPANY_ID}}"
  auth:
    type: bearer
    token: "{{AGENT_ACCESS}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
