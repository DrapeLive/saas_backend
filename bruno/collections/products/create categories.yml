info:
  name: create categories
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/categories/"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Shirt
        contentType: Text
      - name: slug
        type: text
        value: shirt
      - name: description
        type: text
        value: Shirt for all gender
      - name: image
        type: file
        value:
          - /Users/fahad/Downloads/churuli.jpg
        contentType: image/jpeg
      - name: display_order
        type: text
        value: "1"
      - name: is_active
        type: text
        value: "true"
      - name: default_commission_pct
        type: text
        value: "1"
      - name: parent
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{ACCESS}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
