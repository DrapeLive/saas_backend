info:
    name: Token Refresh
    type: http
    seq: 11

http:
    method: POST
    url: "{{base_url}}/api/auth/refresh"
    body:
        type: json
        data: |-
            {
              "refresh": "{{refresh_token}}"
            }
    auth:
        type: none

runtime:
    scripts:
        - type: after-response
          code: |-
              if (res.body.access) {
                bru.setEnvVar("auth_token", res.body.access);
                bru.setVar("auth_token", res.body.access);
              }
              if (res.body.refresh) {
                bru.setVar("refresh_token", res.body.refresh);
                bru.setVar("new_refresh_token", res.body.refresh);
              }
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("has new access token", function() {
                expect(res.body).to.have.property("access");
              });

settings:
    encodeUrl: true
