info:
  name: Password Change
  type: http
  seq: 6

http:
  method: POST
  url: {{base_url}}/api/auth/password/change
  body:
    type: json
    data: |-
      {
        "old_password": "{{login_password}}",
        "new_password": "NewPass@12345678"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
