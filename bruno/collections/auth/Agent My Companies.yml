info:
    name: Agent My Companies
    type: http
    seq: 12

http:
    method: GET
    url: "{{base_url}}/api/auth/agents/companies"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns array of companies", function() {
                expect(Array.isArray(res.body)).to.be.true;
              });
              test("each has company info", function() {
                if (res.body.length > 0) {
                  expect(res.body[0]).to.have.property("name");
                  expect(res.body[0]).to.have.property("membership_status");
                  expect(res.body[0]).to.have.property("order_count");
                }
              });

settings:
    encodeUrl: true
