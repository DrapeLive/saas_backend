info:
    name: Password Reset Confirm
    type: http
    seq: 8

http:
    method: POST
    url: "{{base_url}}/api/auth/password/reset/confirm"
    body:
        type: json
        data: |-
            {
              "token": "{{reset_token}}",
              "uid": "{{reset_uid}}",
              "new_password": "NewPass@12345678"
            }
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });

settings:
    encodeUrl: true
