info:
    name: Agent My Performance
    type: http
    seq: 14

http:
    method: GET
    url: "{{base_url}}/api/auth/agents/performance"
    headers:
        - name: X-Company-Id
          value: "{{company_id}}"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: company_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns performance data", function() {
                expect(res.body).to.have.property("orders_this_month");
                expect(res.body).to.have.property("sales_this_month");
                expect(res.body).to.have.property("commission_earned");
                expect(res.body).to.have.property("leaderboard_rank");
                expect(res.body).to.have.property("target_vs_actual");
              });

settings:
    encodeUrl: true
