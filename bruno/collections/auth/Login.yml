info:
    name: Login
    type: http
    seq: 2

http:
    method: POST
    url: "{{base_url}}/api/auth/login"
    body:
        type: json
        data: |-
            {
              "email": "{{login_email}}",
              "password": "{{login_password}}"
            }

runtime:
    scripts:
        - type: after-response
          code: |-
              if (res.body.access) {
                bru.setGlobalEnvVar("auth_token", res.body.access, { persist: true });
                console.log("Auth token set!")

              } else {
                console.error("Login failed — no access token in response");
              }
              if (res.body.refresh) {
                bru.setVar("refresh_token", res.body.refresh);
              }
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("has access token", function() {
                expect(res.body).to.have.property("access");
              });
              test("has refresh token", function() {
                expect(res.body).to.have.property("refresh");
              });

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
