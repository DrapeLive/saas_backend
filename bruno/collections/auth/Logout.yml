info:
    name: Logout
    type: http
    seq: 3

http:
    method: POST
    url: "{{base_url}}/api/auth/logout"
    body:
        type: json
        data: |-
            {
              "refresh": "{{refresh_token}}"
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });

settings:
    encodeUrl: true
