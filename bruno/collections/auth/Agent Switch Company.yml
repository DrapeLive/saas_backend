info:
    name: Agent Switch Company
    type: http
    seq: 13

http:
    method: POST
    url: "{{base_url}}/api/auth/agents/switch-company"
    body:
        type: json
        data: |-
            {
              "company_id": "{{company_id}}"
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: company_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns new tokens", function() {
                expect(res.body).to.have.property("access");
                expect(res.body).to.have.property("refresh");
                expect(res.body).to.have.property("company_id");
              });

settings:
    encodeUrl: true
