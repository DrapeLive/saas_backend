info:
    name: Agent Register
    type: http
    seq: 9

http:
    method: POST
    url: "{{base_url}}/api/auth/agents/register"
    body:
        type: json
        data: |-
            {
              "email": "agent@example.com",
              "password": "Agent@12345678",
              "full_name": "Test Agent",
              "phone": "9876543212"
            }
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 201", function() {
                expect(res.status).to.equal(201);
              });
              test("returns user data", function() {
                expect(res.body).to.have.property("id");
                expect(res.body).to.have.property("email");
                expect(res.body).to.have.property("role", "agent");
              });

settings:
    encodeUrl: true
