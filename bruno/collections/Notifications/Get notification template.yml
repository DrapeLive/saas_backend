info:
  name: Get notification template
  type: http
  seq: 3
  tags:
    - Notifications

http:
  method: GET
  url: "{{baseUrl}}/api/notification-templates/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/notification-templates/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "company": "",
            "event_type": "order_submitted",
            "channel": "whatsapp",
            "subject": "",
            "body": "",
            "whatsapp_template_name": "",
            "is_active": false,
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/notification-templates/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
