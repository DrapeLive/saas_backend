info:
  name: Update notification template
  type: http
  seq: 4
  tags:
    - Notifications

http:
  method: PATCH
  url: "{{baseUrl}}/api/notification-templates/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "event_type": "order_submitted",
        "channel": "whatsapp",
        "subject": "",
        "body": "",
        "whatsapp_template_name": "",
        "is_active": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

