      type: query
      description: Filter by channel.
      disabled: true
    - name: date_from
      value: ""
      type: query
      description: Only notifications created on or after this date.
      disabled: true
    - name: status
      value: delivered
      type: query
      description: Filter by status.
      disabled: true
    - name: status
      value: failed
      type: query
      description: Filter by status.
      disabled: true
