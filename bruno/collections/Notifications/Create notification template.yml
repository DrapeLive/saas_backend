info:
  name: Create notification template
  type: http
  seq: 2
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/notification-templates/"
  body:
    type: json
    data: |-
      {
        "event_type": "order_submitted",
        "channel": "whatsapp",
        "subject": "",
        "body": "",
        "whatsapp_template_name": "",
        "is_active": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/notification-templates/"
      method: POST
      body:
        type: json
        data: |-
          {
            "event_type": "order_submitted",
            "channel": "whatsapp",
            "subject": "",
            "body": "",
            "whatsapp_template_name": "",
            "is_active": false
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "company": "",
            "event_type": "order_submitted",
            "channel": "whatsapp",
            "subject": "",
            "body": "",
            "whatsapp_template_name": "",
            "is_active": false,
            "created_at": "",
            "updated_at": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/notification-templates/"
      method: POST
      body:
        type: json
        data: |-
          {
            "event_type": "order_submitted",
            "channel": "whatsapp",
            "subject": "",
            "body": "",
            "whatsapp_template_name": "",
            "is_active": false
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 403 Response
    description: Forbidden. The authenticated user is not allowed to perform this action.
    request:
      url: "{{baseUrl}}/api/notification-templates/"
      method: POST
      body:
        type: json
        data: |-
          {
            "event_type": "order_submitted",
            "channel": "whatsapp",
            "subject": "",
            "body": "",
            "whatsapp_template_name": "",
            "is_active": false
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
