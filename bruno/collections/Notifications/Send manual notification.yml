info:
  name: Send manual notification
  type: http
  seq: 9
  tags:
    - Notifications

http:
  method: POST
  url: "{{baseUrl}}/api/notifications/send/"
  body:
    type: json
    data: |-
      {
        "recipient_ids": [],
        "recipient_phones": [],
        "channel": "whatsapp",
        "template_id": "",
        "subject": "",
        "body": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

