info:
  name: Cancel subscription
  type: http
  seq: 7
  tags:
    - Subscriptions

http:
  method: POST
  url: "{{baseUrl}}/api/subscriptions/:id/cancel/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

