info:
  name: My subscription usage
  type: http
  seq: 3
  tags:
    - Subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/my-subscription/usage/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/my-subscription/usage/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "snapshot_month": "",
              "agent_count": 0,
              "customer_count": 0,
              "product_count": 0,
              "order_count": 0,
              "storage_used_mb": 0
            }
          ]
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/my-subscription/usage/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Usage snapshots for the current company's subscription.
