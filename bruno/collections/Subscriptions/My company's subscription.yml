info:
  name: My company's subscription
  type: http
  seq: 1
  tags:
    - Subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/my-subscription/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/my-subscription/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "plan": "",
              "billing_cycle": "monthly",
              "status": "trial",
              "trial_start": "",
              "trial_end": "",
              "current_period_start": "",
              "current_period_end": "",
              "grace_period_end": "",
              "cancelled_at": "",
              "price_paid": "",
              "discount_pct": "",
              "engagement_score": 0,
              "notes": "",
              "days_remaining": 0,
              "is_usable": false,
              "events": [
                {
                  "id": "",
                  "event_type": "created",
                  "from_plan_name": "",
                  "to_plan_name": "",
                  "performed_by_name": "",
                  "notes": "",
                  "metadata": "",
                  "created_at": ""
                }
              ],
              "usage": [
                {
                  "id": "",
                  "snapshot_month": "",
                  "agent_count": 0,
                  "customer_count": 0,
                  "product_count": 0,
                  "order_count": 0,
                  "storage_used_mb": 0
                }
              ]
            }
          ]
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/my-subscription/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Read-only. Returns the caller's own company subscription
