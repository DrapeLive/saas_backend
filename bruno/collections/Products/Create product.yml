info:
  name: Create product
  type: http
  seq: 2
  tags:
    - Products

http:
  method: POST
  url: "{{baseUrl}}/api/products/"
  body:
    type: json
    data: |-
      {
        "category": "",
        "name": "",
        "description": "",
        "sku_prefix": "",
        "hsn_code": "",
        "gst_rate": "",
        "size_chart": "",
        "mrp": "",
        "wholesale_price": "",
        "minimum_order_qty": 0,
        "order_in_multiples": 0,
        "status": "active",
        "color_variants": [
          {
            "color_name": "",
            "color_hex": "",
            "image": "",
            "is_primary": false,
            "is_active": false,
            "sizes": [
              {
                "size": "",
                "sku": "",
                "price_override": "",
                "stock_quantity": 0,
                "reorder_level": 0,
                "is_active": false
              }
            ]
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

