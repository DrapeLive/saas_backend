info:
  name: Get product details
  type: http
  seq: 3
  tags:
    - Products

http:
  method: GET
  url: "{{baseUrl}}/api/products/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/products/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "category": "",
            "category_name": "",
            "name": "",
            "description": "",
            "sku_prefix": "",
            "hsn_code": "",
            "gst_rate": "",
            "size_chart": "",
            "size_chart_name": "",
            "mrp": "",
            "wholesale_price": "",
            "minimum_order_qty": 0,
            "order_in_multiples": 0,
            "total_stock": 0,
            "status": "active",
            "color_variants": [
              {
                "id": "",
                "color_name": "",
                "color_hex": "",
                "image": "",
                "is_primary": false,
                "sku": "",
                "qr_code": "",
                "is_active": false,
                "sizes": [
                  {
                    "id": "",
                    "size": "",
                    "sku": "",
                    "price_override": "",
                    "stock_quantity": 0,
                    "reserved_qty": 0,
                    "available_qty": 0,
                    "reorder_level": 0,
                    "is_low_stock": false,
                    "is_active": false
                  }
                ],
                "created_at": "",
                "updated_at": ""
              }
            ],
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/products/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Full product record including images, color variants and per-size stock.
