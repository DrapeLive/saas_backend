info:
  name: Add color variant
  type: http
  seq: 7
  tags:
    - Products

http:
  method: POST
  url: "{{baseUrl}}/api/products/:product_pk/variants/"
  params:
    - name: product_pk
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "color_name": "",
        "color_hex": "",
        "image": "",
        "is_primary": false,
        "is_active": false,
        "sizes": [
          {
            "size": "",
            "sku": "",
            "price_override": "",
            "stock_quantity": 0,
            "reorder_level": 0,
            "is_active": false
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

