info:
  name: Update product
  type: http
  seq: 4
  tags:
    - Products

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "category": "",
        "name": "",
        "description": "",
        "hsn_code": "",
        "gst_rate": "",
        "size_chart": "",
        "mrp": "",
        "wholesale_price": "",
        "minimum_order_qty": 0,
        "order_in_multiples": 0,
        "status": "active"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

