info:
  name: Get color variant
  type: http
  seq: 8
  tags:
    - Products

http:
  method: GET
  url: "{{baseUrl}}/api/products/:product_pk/variants/:id/"
  params:
    - name: id
      value: ""
      type: path
    - name: product_pk
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/products/:product_pk/variants/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
        - name: product_pk
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "color_name": "",
            "color_hex": "",
            "image": "",
            "is_primary": false,
            "sku": "",
            "qr_code": "",
            "is_active": false,
            "sizes": [
              {
                "id": "",
                "size": "",
                "sku": "",
                "price_override": "",
