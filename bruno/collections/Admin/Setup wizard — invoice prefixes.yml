info:
  name: Setup wizard — invoice prefixes
  type: http
  seq: 7
  tags:
    - Admin

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/setup/invoice"
  body:
    type: json
    data: |-
      {
        "invoice_prefix": "",
        "po_prefix": "",
        "financial_year_start": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
