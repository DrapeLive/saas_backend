info:
  name: Business home metrics
  type: http
  seq: 11
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/business/stats"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/business/stats"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "total_customers": 0,
              "overdue_customers": 0,
              "overdue_invoices": 0,
              "total_agents": 0,
              "active_agents_today": 0,
              "outstanding_total": "",
              "overdue_total": ""
            }
          ]

docs: "Business-screen counters: total/overdue customers, agent counts, outstanding/overdue receivables and overdue invoice count. Requires an approved company."
