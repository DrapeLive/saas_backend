info:
  name: Top agents today
  type: http
  seq: 5
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/api/admin/dashboard/top-agents"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/dashboard/top-agents"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "image": "",
              "name": "",
              "number_of_orders_today": 0,
              "total_order_payment_today": ""
            }
          ]

