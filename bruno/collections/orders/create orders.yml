info:
  name: create orders
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/orders/"
  headers:
    - name: X-Company-Id
      value: "{{COMPANY_ID}}"
  body:
    type: json
    data: |-
      {
        "customer": "1e2fa808-3f4c-42b6-8d23-99b5dc6ab5e0",
        "items": [
          {
            "variant_size": "0bf69bd6-6791-4764-a0b4-8e71e7b8596d",
            "quantity": 2
          }
        ],
        "discount_pct": 5,
        "delivery_address_line1": "Flat 302, Green Residency",
        "delivery_address_line2": "MG Road",
        "delivery_city": "Bengaluru",
        "delivery_state": "Karnataka",
        "delivery_pincode": "560001",
        "expected_delivery_date": "2026-08-05",
        "order_notes": " deliver between 10 AM and 1 PM.",
        "is_offline_order": false,
        "offline_created_at": null
      }
  auth:
    type: bearer
    token: "{{AGENT_ACCESS}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
