info:
  name: list orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/orders/"
  headers:
    - name: X-Company-Id
      value: 34548a8b-3322-44f3-ad9b-48ba4e40278c
  auth:
    type: bearer
    token: "{{AGENT_ACCESS}}"

runtime:
  variables:
    - name: BASE_URL
      value: http://localhost:8000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
