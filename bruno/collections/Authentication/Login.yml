info:
  name: Login
  type: http
  seq: 3
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@gmail.com",
        "password": "password!123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access": "",
            "refresh": "",
            "user": {
              "id": "",
              "email": "",
              "full_name": "",
              "phone": "",
              "role": "",
              "company": "",
              "company_name": "",
              "company_status": "",
              "is_active": false,
              "created_at": "",
              "updated_at": ""
            }
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 429 Response
    description: Too many requests. Rate limit exceeded.
    request:
      url: "{{baseUrl}}/api/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: |-
  Authenticate with email + password. Returns an access token, a refresh token and the full user profile. The JWT carries `company_id`, `role` and `is_super_admin` claims.

  Rate limited to 5 requests per minute per IP.
