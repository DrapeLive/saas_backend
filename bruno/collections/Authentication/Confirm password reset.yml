info:
  name: Confirm password reset
  type: http
  seq: 9
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/password/reset/confirm"
  body:
    type: json
    data: |-
      {
        "token": "",
        "uid": "",
        "new_password": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/password/reset/confirm"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "",
            "uid": "",
            "new_password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/auth/password/reset/confirm"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "",
            "uid": "",
            "new_password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
