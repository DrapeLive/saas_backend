info:
  name: Accept agent invitation
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/agents/join"
  body:
    type: json
    data: |-
      {
        "invite_code": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/agents/join"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "membership_status": "pending"
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/auth/agents/join"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/auth/agents/join"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 403 Response
    description: Forbidden. The authenticated user is not allowed to perform this action.
    request:
      url: "{{baseUrl}}/api/auth/agents/join"
      method: POST
      body:
        type: json
        data: |-
          {
            "invite_code": ""
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Agents join a company by redeeming an invitation code. Creates or reactivates a `pending` membership for the invited company (and the inviter's company when they differ).
