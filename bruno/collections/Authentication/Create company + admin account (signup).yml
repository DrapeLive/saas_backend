info:
  name: Create company + admin account (signup)
  type: http
  seq: 11
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/signup"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": "",
        "full_name": "",
        "phone": "",
        "company_name": "",
        "company_slug": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/auth/signup"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": "",
            "company_name": "",
            "company_slug": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access": "",
            "refresh": "",
            "user": {
              "id": "",
              "email": "",
              "full_name": "",
              "phone": "",
              "role": "",
              "company": "",
              "company_name": "",
              "company_status": "",
              "is_active": false,
              "created_at": "",
              "updated_at": ""
            }
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/auth/signup"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": "",
            "company_name": "",
            "company_slug": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 429 Response
    description: Too many requests. Rate limit exceeded.
    request:
      url: "{{baseUrl}}/api/auth/signup"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": "",
            "company_name": "",
            "company_slug": ""
          }
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Registers a new tenant company with a `pending` approval status and creates its first `admin` user. Returns the same token envelope as login. Rate limited to 3 requests per minute per IP.
