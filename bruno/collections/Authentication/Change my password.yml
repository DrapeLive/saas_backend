info:
  name: Change my password
  type: http
  seq: 7
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/password/change"
  body:
    type: json
    data: |-
      {
        "old_password": "",
        "new_password": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/password/change"
      method: POST
      body:
        type: json
        data: |-
          {
            "old_password": "",
            "new_password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/auth/password/change"
      method: POST
      body:
        type: json
        data: |-
          {
            "old_password": "",
            "new_password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/auth/password/change"
      method: POST
      body:
        type: json
        data: |-
          {
            "old_password": "",
            "new_password": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
