info:
  name: Refresh access token
  type: http
  seq: 10
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access": ""
          }
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Exchange a valid refresh token for a fresh access token. Returns only the new `access` token in a flat `{access}` envelope.
