info:
  name: Change company status
  type: http
  seq: 7
  tags:
    - Companies

http:
  method: POST
  url: "{{baseUrl}}/api/super-admin/companies/:id/status"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "pending",
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

