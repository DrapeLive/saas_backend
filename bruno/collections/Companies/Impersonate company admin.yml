info:
  name: Impersonate company admin
  type: http
  seq: 6
  tags:
    - Companies

http:
  method: POST
  url: "{{baseUrl}}/api/super-admin/companies/:id/impersonate"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "slug": "",
        "logo": "",
        "gstin": "",
        "gstin_verified": false,
        "contact_email": "",
        "contact_phone": "",
        "city": "",
        "state": "",
        "status": "pending",
        "tally_enabled": false,
        "whatsapp_enabled": false,
        "setup_completed": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

