info:
  name: Soft-delete company
  type: http
  seq: 3
  tags:
    - Companies

http:
  method: DELETE
  url: "{{baseUrl}}/api/super-admin/companies/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: No response body
    request:
      url: "{{baseUrl}}/api/super-admin/companies/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/super-admin/companies/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 409 Response
    description: Conflict. The operation violates a business rule.
    request:
      url: "{{baseUrl}}/api/super-admin/companies/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Marks a company as deleted (only allowed when not on an active subscription). Returns 204 on success.
