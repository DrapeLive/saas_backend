info:
  name: List all companies
  type: http
  seq: 1
  tags:
    - Companies

http:
  method: GET
  url: "{{baseUrl}}/api/super-admin/companies"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/super-admin/companies"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "slug": "",
              "logo": "",
              "gstin": "",
              "gstin_verified": false,
              "contact_email": "",
              "contact_phone": "",
              "city": "",
              "state": "",
              "status": "pending",
              "plan_tier": "",
              "subscription_status": "",
              "trial_end": "",
              "period_end": "",
              "tally_enabled": false,
              "whatsapp_enabled": false,
              "setup_completed": false,
              "created_at": "",
              "updated_at": ""
            }
          ]

docs: Super-admin only. Lists every tenant company on the platform with subscription plan/tier/trial details, newest first.
