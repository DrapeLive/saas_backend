info:
  name: Extend trial period
  type: http
  seq: 5
  tags:
    - Companies

http:
  method: POST
  url: "{{baseUrl}}/api/super-admin/companies/:id/extend-trial"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "days": 0,
        "reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

