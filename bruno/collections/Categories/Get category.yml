info:
  name: Get category
  type: http
  seq: 3
  tags:
    - Categories

http:
  method: GET
  url: "{{baseUrl}}/api/categories/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/categories/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "slug": "",
            "parent": "",
            "description": "",
            "image": "",
            "display_order": 0,
            "is_active": false,
            "default_commission_pct": "",
            "children": [
              {
                "id": "",
                "name": "",
                "slug": "",
                "parent": "",
                "parent_name": "",
                "image": "",
                "display_order": 0,
                "is_active": false,
                "default_commission_pct": "",
                "product_count": 0
              }
            ],
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/categories/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
