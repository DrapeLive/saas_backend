info:
  name: List size charts
  type: http
  seq: 1
  tags:
    - Size_Charts

http:
  method: GET
  url: "{{baseUrl}}/api/size-charts/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/size-charts/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "sizes": "",
              "created_at": "",
              "updated_at": ""
            }
          ]
