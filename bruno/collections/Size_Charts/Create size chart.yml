info:
  name: Create size chart
  type: http
  seq: 2
  tags:
    - Size_Charts

http:
  method: POST
  url: "{{baseUrl}}/api/size-charts/"
  body:
    type: json
    data: |-
      {
        "name": "",
        "sizes": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/size-charts/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "sizes": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "sizes": "",
            "created_at": "",
            "updated_at": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/size-charts/"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "sizes": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
