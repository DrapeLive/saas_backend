info:
  name: Update size chart
  type: http
  seq: 3
  tags:
    - Size_Charts

http:
  method: PATCH
  url: "{{baseUrl}}/api/size-charts/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "sizes": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

