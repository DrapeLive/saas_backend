info:
  name: list companies
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/super-admin/companies"
  auth:
    type: bearer
    token: "{{access}}"

runtime:
  variables:
    - name: BASE_URL
      value: http://localhost:8000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
