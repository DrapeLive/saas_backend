info:
  name: Send payment reminders
  type: http
  seq: 2
  tags:
    - Payments

http:
  method: POST
  url: "{{baseUrl}}/api/outstanding/send-reminder/"
  body:
    type: json
    data: |-
      {
        "customer_ids": [],
        "channel": "",
        "message": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/outstanding/send-reminder/"
      method: POST
      body:
        type: json
        data: |-
          {
            "customer_ids": [],
            "channel": "",
            "message": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "channel": "",
            "customer_count": 0
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/outstanding/send-reminder/"
      method: POST
      body:
        type: json
        data: |-
          {
            "customer_ids": [],
            "channel": "",
            "message": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Queues WhatsApp/email payment reminders for a set of customers.
