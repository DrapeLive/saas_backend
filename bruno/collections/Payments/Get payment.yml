info:
  name: Get payment
  type: http
  seq: 6
  tags:
    - Payments

http:
  method: GET
  url: "{{baseUrl}}/api/payments/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/payments/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "invoice": "",
            "invoice_number": "",
            "customer": "",
            "customer_name": "",
            "agent": "",
            "agent_name": "",
            "amount": "",
            "payment_date": "",
            "mode": "cash",
            "reference_no": "",
            "receipt_file": "",
            "notes": "",
            "is_from_tally": false,
            "tally_ref": "",
            "recorded_by_name": "",
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/payments/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
