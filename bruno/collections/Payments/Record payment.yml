info:
  name: Record payment
  type: http
  seq: 5
  tags:
    - Payments

http:
  method: POST
  url: "{{baseUrl}}/api/payments/"
  body:
    type: json
    data: |-
      {
        "invoice": "50bfe34f-d413-45ef-b19a-719f1aaee878",
        "customer": "1e2fa808-3f4c-42b6-8d23-99b5dc6ab5e0",
        "agent": "3803b335-14f5-44d8-877c-0238204026a7",
        "amount": "50000",
        "payment_date": "2026-03-05",
        "mode": "cash",
        "reference_no": "",
        "receipt_file": "",
        "notes": "Payment"
      }
  auth:
    type: bearer
    token: "{{ACCESS}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/payments/"
      method: POST
      body:
        type: json
        data: |-
          {
            "invoice": "",
            "customer": "",
            "agent": "",
            "amount": "",
            "payment_date": "",
            "mode": "cash",
            "reference_no": "",
            "receipt_file": "",
            "notes": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "invoice": "",
            "invoice_number": "",
            "customer": "",
            "customer_name": "",
            "agent": "",
            "agent_name": "",
            "amount": "",
            "payment_date": "",
            "mode": "cash",
            "reference_no": "",
            "receipt_file": "",
            "notes": "",
            "is_from_tally": false,
            "tally_ref": "",
            "recorded_by_name": "",
            "created_at": "",
            "updated_at": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/payments/"
      method: POST
      body:
        type: json
        data: |-
          {
            "invoice": "",
            "customer": "",
            "agent": "",
            "amount": "",
            "payment_date": "",
            "mode": "cash",
            "reference_no": "",
            "receipt_file": "",
            "notes": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Records a payment, updates the invoice paid/due amounts and the customer's outstanding balance.
