  url: {{base_url}}/api/super-admin/companies/{{company_id}}/extend-trial
  body:
    type: json
    data: |-
      {
        "days": 7,
        "reason": "Customer requested extension"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
