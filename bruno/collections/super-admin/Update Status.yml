info:
    name: Update Status
    type: http
    seq: 3

http:
    method: POST
    url: "{{base_url}}/api/super-admin/companies/{{company_id}}/status"
    body:
        type: json
        data: |-
            {
              "status": "trial"
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });

settings:
    encodeUrl: true
