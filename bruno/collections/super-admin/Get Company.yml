info:
  name: Get Company
  type: http
  seq: 2

http:
  method: GET
  url: {{base_url}}/api/super-admin/companies/{{company_id}}
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns company data", function() {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
