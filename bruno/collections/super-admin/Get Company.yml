info:
  name: Get Company
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/super-admin/companies/{{company_id}}"
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  variables:
    - name: company_id
      value: b6a92213-117e-4be8-8a2d-39600061f49f
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns company data", function() {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
