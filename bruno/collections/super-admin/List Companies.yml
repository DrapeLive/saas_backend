info:
  name: List Companies
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/super-admin/companies"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns array", function() {
          const body = res.getBody();
          expect(Array.isArray(body) || (body.results && Array.isArray(body.results))).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
