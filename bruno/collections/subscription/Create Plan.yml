info:
  name: Create Plan
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/plans/"
  body:
    type: json
    data: |-
      {
        "tier": "free",
        "name": "Free",
        "description": "Good and Free",
        "monthly_price": 0,
        "yearly_price": 0,
        "trial_days": 0,
        "max_agents": 1,
        "max_customers": 50,
        "max_products": 100,
        "max_orders_per_month": 50,
        "storage_gb": 10,
        "tally_sync_enabled": false,
        "whatsapp_enabled": false,
        "gst_verify_enabled": false,
        "analytics_advanced": true,
        "offline_mode_enabled": false,
        "api_access_enabled": false,
        "custom_domain_enabled": false,
        "dedicated_support": false,
        "is_active": true,
        "display_order": 0
      }
  auth:
    type: bearer
    token: "{{access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
