info:
  name: Customer orders
  type: http
  seq: 12
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/:id/orders/"
  params:
    - name: id
      value: b41c24bd-fb5d-4351-b71f-cef183bda290
      type: path
      description: A UUID string identifying this customer profile.
  auth:
    type: bearer
    token: "{{ACCESS}}"

settings:
