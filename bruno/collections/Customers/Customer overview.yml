info:
  name: Customer overview
  type: http
  seq: 19
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/overview/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/customers/overview/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "active_customer_count": 0,
            "total_outstanding_receivable": ""
          }

docs: Company-level active customer count and total outstanding receivable.
