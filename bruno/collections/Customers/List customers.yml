info:
  name: List customers
  type: http
  seq: 1
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/customers/"
  params:
    - name: assigned_agent
      value: ""
      type: query
      description: Filter by assigned agent id.
      disabled: true
    - name: ordering
      value: created_at
      type: query
      description: Sort field. Prefix with `-` for descending (default `-created_at`).
      disabled: true
    - name: ordering
      value: overdue_outstanding
      type: query
      description: Sort field. Prefix with `-` for descending (default `-created_at`).
      disabled: true
    - name: ordering
      value: total_outstanding
      type: query
      description: Sort field. Prefix with `-` for descending (default `-created_at`).
      disabled: true
    - name: ordering
      value: trade_name
      type: query
      description: Sort field. Prefix with `-` for descending (default `-created_at`).
      disabled: true
    - name: page
      value: ""
      type: query
      description: Page number (default 1).
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Page size (default 10).
      disabled: true
    - name: search
      value: ""
      type: query
      description: Search trade name, legal name, phone, GSTIN or email.
      disabled: true
    - name: segment
      value: bronze
      type: query
      description: Filter by computed segment.
      disabled: true
    - name: segment
      value: gold
      type: query
      description: Filter by computed segment.
      disabled: true
    - name: segment
      value: platinum
      type: query
      description: Filter by computed segment.
      disabled: true
    - name: segment
      value: silver
      type: query
      description: Filter by computed segment.
      disabled: true
    - name: status
      value: active
      type: query
      description: Filter by customer status.
      disabled: true
    - name: status
      value: blocked
      type: query
      description: Filter by customer status.
      disabled: true
    - name: status
      value: inactive
      type: query
      description: Filter by customer status.
      disabled: true
    - name: tag
      value: ""
      type: query
      description: Filter by a single tag string.
      disabled: true
  auth:
    type: bearer
    token: "{{AGENT_ACCESS}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

