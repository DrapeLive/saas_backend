info:
  name: Customer payments
  type: http
  seq: 14
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/:id/payments/"
  params:
    - name: id
      value: b41c24bd-fb5d-4351-b71f-cef183bda290
      type: path
      description: A UUID string identifying this customer profile.
  auth:
    type: bearer
    token: "{{ACCESS}}"

settings:
