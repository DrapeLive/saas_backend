info:
  name: Customer summary
  type: http
  seq: 15
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/:id/summary/"
  params:
    - name: id
      value: ""
      type: path
      description: A UUID string identifying this customer profile.
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
