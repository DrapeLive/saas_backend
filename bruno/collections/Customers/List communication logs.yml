info:
  name: List communication logs
  type: http
  seq: 6
  tags:
    - Customers

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/:id/communication-logs/"
  params:
    - name: id
      value: ""
      type: path
      description: A UUID string identifying this customer profile.
    - name: page
      value: ""
      type: query
      description: A page number within the paginated result set.
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Number of results to return per page.
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

