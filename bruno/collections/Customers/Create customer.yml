  tags:
    - Customers

http:
  method: POST
  url: "{{baseUrl}}/api/admin/customers/"
  body:
    type: json
    data: |-
      {
        "legal_name": "",
        "trade_name": "",
        "owner_name": "",
        "email": "",
        "phone": "",
        "whatsapp_number": "",
        "gstin": "",
        "pan": "",
        "tags": "",
        "billing_address_line1": "",
