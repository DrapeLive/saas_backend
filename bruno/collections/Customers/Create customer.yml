        "shipping_city": "",
        "shipping_state": "",
        "shipping_pincode": "",
        "same_as_billing": false,
        "assigned_agent": "",
        "credit_limit": "",
        "payment_terms_days": 0,
        "auto_block_on_exceed": false,
        "status": "active",
        "internal_notes": ""
