info:
  name: Switch active company (agent)
  type: http
  seq: 15
  tags:
    - Agents

http:
  method: POST
  url: "{{baseUrl}}/api/auth/agents/switch-company"
  headers:
    - name: X-Company-Id
      value: ""
      description: Optional company to operate in. Agents whose JWT does not carry a `company_id` claim must pass an active membership company via this header to access company-scoped endpoints.
      disabled: true
  body:
    type: json
    data: |-
      {
        "company_id": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

