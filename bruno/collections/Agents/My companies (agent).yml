info:
  name: My companies (agent)
  type: http
  seq: 13
  tags:
    - Agents

http:
  method: GET
  url: "{{baseUrl}}/api/auth/agents/companies"
  headers:
    - name: X-Company-Id
      value: ""
      description: Optional company to operate in. Agents whose JWT does not carry a `company_id` claim must pass an active membership company via this header to access company-scoped endpoints.
      disabled: true
  params:
    - name: page
      value: ""
      type: query
      description: A page number within the paginated result set.
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Number of results to return per page.
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/auth/agents/companies"
      method: GET
      headers:
        - name: X-Company-Id
          value: ""
          description: Optional company to operate in. Agents whose JWT does not carry a `company_id` claim must pass an active membership company via this header to access company-scoped endpoints.
          disabled: true
      params:
        - name: page
          value: ""
          type: query
          description: A page number within the paginated result set.
          disabled: true
        - name: page_size
          value: ""
          type: query
          description: Number of results to return per page.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 123,
            "next": "http://api.example.org/accounts/?page=4",
            "previous": "http://api.example.org/accounts/?page=2",
            "results": [
              {
                "id": "",
                "name": "",
                "logo": "",
                "membership_id": "",
                "membership_status": "",
                "territory": "",
                "order_count": 0
              }
            ]
          }

docs: Agent-facing. Lists the companies the agent belongs to with this month's order counts.
