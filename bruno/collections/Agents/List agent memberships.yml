info:
  name: List agent memberships
  type: http
  seq: 1
  tags:
    - Agents

http:
  method: GET
  url: "{{baseUrl}}/api/admin/agents"
  params:
    - name: page
      value: ""
      type: query
      description: A page number within the paginated result set.
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Number of results to return per page.
      disabled: true
    - name: search
      value: ""
      type: query
      description: Search by agent full name, email or employee code.
      disabled: true
    - name: status
      value: ""
      type: query
      description: "Filter by membership status: pending | reviewed | active | suspended | removed."
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/agents"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: A page number within the paginated result set.
          disabled: true
        - name: page_size
          value: ""
          type: query
          description: Number of results to return per page.
          disabled: true
        - name: search
          value: ""
          type: query
          description: Search by agent full name, email or employee code.
          disabled: true
        - name: status
          value: ""
          type: query
          description: "Filter by membership status: pending | reviewed | active | suspended | removed."
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 123,
            "next": "http://api.example.org/accounts/?page=4",
            "previous": "http://api.example.org/accounts/?page=2",
            "results": [
              {
                "id": "",
                "agent_id": "",
                "user": "",
                "company_name": "",
                "status": "",
                "territory": "",
                "clients_count": 0,
                "commission_total": "",
                "commission_pending": "",
                "monthly_target": "",
                "custom_commission_plan": "",
                "commission_plan_name": "",
                "invitation_method": "",
                "joined_at": "",
                "removed_at": "",
                "approved_by": "",
                "reviewed_by": "",
                "reviewed_at": "",
                "created_at": "",
                "updated_at": ""
              }
            ]
          }
  - name: 401 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/admin/agents"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: A page number within the paginated result set.
          disabled: true
        - name: page_size
          value: ""
          type: query
          description: Number of results to return per page.
          disabled: true
        - name: search
          value: ""
          type: query
          description: Search by agent full name, email or employee code.
          disabled: true
        - name: status
          value: ""
          type: query
          description: "Filter by membership status: pending | reviewed | active | suspended | removed."
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: "Company admin/sub-admin: lists agent memberships for the caller's company, newest first. Paginated; supports `status`, `search`, `page` and `page_size`."
