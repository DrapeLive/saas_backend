info:
  name: Agent performance
  type: http
  seq: 6
  tags:
    - Agents

http:
  method: GET
  url: "{{baseUrl}}/api/admin/agents/:id/performance"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/agents/:id/performance"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "orders_this_month": 0,
            "sales_this_month": "",
            "commission_earned": "",
            "commission_preview": "",
            "leaderboard_rank": 0,
            "target_vs_actual": 0,
            "monthly_target": ""
          }
  - name: 403 Response
