info:
  name: Agent leaderboard
  type: http
  seq: 11
  tags:
    - Agents

http:
  method: GET
  url: "{{baseUrl}}/api/admin/agents/leaderboard"
  params:
    - name: page
      value: ""
      type: query
      description: A page number within the paginated result set.
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Number of results to return per page.
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
