info:
  name: List Companies
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/super-admin/companies"
  auth:
    type: bearer
    token: "{{SUPERADMIN_ACCESS}}"

runtime:
  variables:
    - name: BASE_URL
      value: https://beta.xlapparals.in/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
