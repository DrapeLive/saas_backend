info:
  name: refresh
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh": "{{AGENT_REFRESH}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
