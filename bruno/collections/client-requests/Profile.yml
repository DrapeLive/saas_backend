info:
  name: Profile
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth:
    type: bearer
    token: "{{ACCESS}}"

runtime:
  variables:
    - name: BASE_URL
      value: https://beta.xlapparals.in/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
