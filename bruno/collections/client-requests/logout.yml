info:
  name: logout
  type: http
  seq: 12

http:
  method: POST
  url: "{{BASE_URL}}/auth/logout"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let responseBody = res.getBody();

        // Set it as an environment variable (Temporary for the active session)
        bru.setEnvVar("ACCESS", responseBody.access);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
