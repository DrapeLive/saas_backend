info:
  name: password change
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/auth/password/change"
  body:
    type: json
    data: |-
      {
        "old_password": "password!123",
        "new_password": "Password&123"
      }
  auth:
    type: bearer
    token: "{{access_admin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
