info:
  name: Add category rate
  type: http
  seq: 11
  tags:
    - Commissions

http:
  method: POST
  url: "{{baseUrl}}/api/commission-plans/:id/category-rates/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "category": "",
        "commission_pct": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

