info:
  name: Get commission plan
  type: http
  seq: 8
  tags:
    - Commissions

http:
  method: GET
  url: "{{baseUrl}}/api/commission-plans/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/commission-plans/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "description": "",
            "is_default": false,
            "slabs": [
              {
                "id": "",
                "min_amount": "",
                "max_amount": "",
                "commission_pct": ""
              }
            ],
            "category_rates": [
              {
                "id": "",
                "category": "",
                "category_name": "",
                "commission_pct": ""
              }
            ],
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/commission-plans/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
