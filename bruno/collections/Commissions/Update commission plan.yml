info:
  name: Update commission plan
  type: http
  seq: 9
  tags:
    - Commissions

http:
  method: PATCH
  url: "{{baseUrl}}/api/commission-plans/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "is_default": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
