info:
  name: Get commission entry
  type: http
  seq: 2
  tags:
    - Commissions

http:
  method: GET
  url: "{{baseUrl}}/api/commission-entries/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/commission-entries/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "agent": "",
            "agent_name": "",
            "order": "",
            "order_number": "",
            "plan_name": "",
            "order_value": "",
            "commission_pct": "",
            "commission_amount": "",
            "status": "pending",
            "settlement_month": "",
            "paid_at": "",
            "paid_by_name": "",
            "dispute_reason": "",
            "adjustment_notes": "",
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/commission-entries/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
