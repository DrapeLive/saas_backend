info:
  name: Update entry status
  type: http
  seq: 3
  tags:
    - Commissions

http:
  method: POST
  url: "{{baseUrl}}/api/commission-entries/:id/status/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "pending",
        "dispute_reason": "",
        "adjustment_notes": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/commission-entries/:id/status/"
