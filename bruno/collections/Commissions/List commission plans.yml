    request:
      url: "{{baseUrl}}/api/commission-plans/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "description": "",
              "is_default": false,
              "slab_count": 0,
              "category_rate_count": 0,
              "agent_count": 0,
              "created_at": ""
            }
          ]
