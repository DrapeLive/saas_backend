info:
  name: List commission plans
  type: http
  seq: 6
  tags:
    - Commissions

http:
  method: GET
  url: "{{baseUrl}}/api/commission-plans/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
