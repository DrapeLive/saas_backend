http:
  method: POST
  url: "{{baseUrl}}/api/orders/"
  body:
    type: json
    data: |-
      {
        "customer": "",
        "items": [
          {
            "variant_size": "",
            "quantity": 0,
            "discount_pct": ""
          }
        ],
        "discount_pct": "",
        "delivery_address_line1": "",
