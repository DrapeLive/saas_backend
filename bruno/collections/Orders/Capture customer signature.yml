info:
  name: Capture customer signature
  type: http
  seq: 7
  tags:
    - Orders

http:
  method: POST
  url: "{{baseUrl}}/api/orders/:id/signature/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "signature_image": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/orders/:id/signature/"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "signature_image": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "signature_image": "",
            "captured_at": "",
            "captured_by_name": ""
          }
