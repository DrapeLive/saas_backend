info:
  name: Approve or reject a pending order
  type: http
  seq: 4
  tags:
    - Orders

http:
  method: POST
  url: "{{baseUrl}}/api/orders/:id/approve/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "action": "approve",
        "rejection_reason": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

