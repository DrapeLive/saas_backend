info:
  name: Record packed quantities per item
  type: http
  seq: 6
  tags:
    - Orders

http:
  method: POST
  url: "{{baseUrl}}/api/orders/:id/pack-items/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "item_id": "6a3f8b2c-1d4e-4f5a-9b0c-7d8e6f5a4b3c",
            "packed_quantity": 80
          }
        ],
        "notes": "20 units short-packed"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

