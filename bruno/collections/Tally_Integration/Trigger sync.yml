info:
  name: Trigger sync
  type: http
  seq: 9
  tags:
    - Tally_Integration

http:
  method: POST
  url: "{{baseUrl}}/api/tally/trigger/"
  body:
    type: json
    data: |-
      {
        "entity_type": "invoice",
        "entity_id": "",
        "direction": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

