info:
  name: List sync logs
  type: http
  seq: 4
  tags:
    - Tally_Integration

http:
  method: GET
  url: "{{baseUrl}}/api/tally/logs/"
  params:
    - name: direction
      value: pull
      type: query
      description: Filter by sync direction.
      disabled: true
    - name: direction
      value: push
      type: query
      description: Filter by sync direction.
      disabled: true
    - name: entity_type
      value: ""
      type: query
      description: Filter by entity type.
      disabled: true
    - name: status
      value: failed
      type: query
      description: Filter by sync status.
      disabled: true
    - name: status
      value: pending
      type: query
      description: Filter by sync status.
      disabled: true
    - name: status
      value: retry
      type: query
      description: Filter by sync status.
      disabled: true
    - name: status
      value: success
      type: query
      description: Filter by sync status.
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

