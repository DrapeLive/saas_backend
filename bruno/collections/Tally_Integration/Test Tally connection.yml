info:
  name: Test Tally connection
  type: http
  seq: 8
  tags:
    - Tally_Integration

http:
  method: POST
  url: "{{baseUrl}}/api/tally/test-connection/"
  body:
    type: json
    data: |-
      {
        "tally_url": "",
        "tally_company": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Success.
    request:
      url: "{{baseUrl}}/api/tally/test-connection/"
      method: POST
      body:
        type: json
        data: |-
          {
            "tally_url": "",
            "tally_company": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/tally/test-connection/"
      method: POST
      body:
        type: json
        data: |-
          {
            "tally_url": "",
            "tally_company": ""
          }
    response:
      status: 400
