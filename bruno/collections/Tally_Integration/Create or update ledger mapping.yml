info:
  name: Create or update ledger mapping
  type: http
  seq: 2
  tags:
    - Tally_Integration

http:
  method: POST
  url: "{{baseUrl}}/api/tally/ledger-mappings/"
  body:
    type: json
    data: |-
      {
        "entity_type": "",
        "entity_id": "",
        "tally_ledger_name": "",
        "tally_group": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

