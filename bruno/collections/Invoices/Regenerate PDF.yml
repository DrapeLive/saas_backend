info:
  name: Regenerate PDF
  type: http
  seq: 5
  tags:
    - Invoices

http:
  method: POST
  url: "{{baseUrl}}/api/invoices/:id/regenerate-pdf/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "force": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/invoices/:id/regenerate-pdf/"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "force": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "",
            "invoice_id": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/invoices/:id/regenerate-pdf/"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "force": false
          }
    response:
      status: 400
