info:
  name: Get invoice
  type: http
  seq: 3
  tags:
    - Invoices

http:
  method: GET
  url: "{{baseUrl}}/api/invoices/:id/"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/invoices/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "invoice_type": "sales_invoice",
            "invoice_number": "",
            "order": "",
            "customer": "",
            "customer_name": "",
            "customer_gstin": "",
            "status": "draft",
            "invoice_date": "",
            "due_date": "",
            "subtotal": "",
            "discount_amount": "",
            "taxable_amount": "",
            "cgst_amount": "",
            "sgst_amount": "",
            "igst_amount": "",
            "total_amount": "",
            "amount_paid": "",
            "amount_due": "",
            "days_overdue": 0,
            "is_interstate": false,
            "reverse_charge": false,
            "place_of_supply": "",
            "pdf_file": "",
            "pdf_generated_at": "",
            "tally_voucher_id": "",
            "tally_synced_at": "",
            "notes": "",
            "items": [
              {
                "id": "",
                "description": "",
                "hsn_code": "",
                "quantity": 0,
                "unit_price": "",
                "discount_pct": "",
                "gst_rate": "",
                "taxable_amount": "",
                "gst_amount": "",
                "line_total": ""
              }
            ],
            "created_at": "",
            "updated_at": ""
          }
  - name: 404 Response
    description: Not found. The requested resource does not exist in the current company.
    request:
      url: "{{baseUrl}}/api/invoices/:id/"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
