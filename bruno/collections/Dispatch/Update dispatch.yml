info:
  name: Update dispatch
  type: http
  seq: 4
  tags:
    - Dispatch

http:
  method: PATCH
  url: "{{baseUrl}}/api/dispatches/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "lr_number": "",
        "transport_name": "",
        "vehicle_number": "",
        "driver_contact": "",
        "expected_delivery": "",
        "actual_delivery": "",
        "tracking_url": "",
        "eway_bill_no": "",
        "boxes_count": 0,
        "weight_kg": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

