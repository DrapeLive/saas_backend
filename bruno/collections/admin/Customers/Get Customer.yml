info:
    name: Get Customer
    type: http
    seq: 3

http:
    method: GET
    url: "{{base_url}}/api/admin/customers/{{customer_id}}"
    headers:
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("has trade_name", function() {
                expect(res.body).to.have.property("trade_name");
              });

settings:
    encodeUrl: true
