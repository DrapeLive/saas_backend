info:
    name: Import Preview
    type: http
    seq: 6

http:
    method: POST
    url: "{{base_url}}/api/admin/customers/import-preview"
    body:
        type: json
        data: |-
            {
              "rows": [
                {"trade_name": "Customer One", "phone": "1111111111"},
                {"trade_name": "Customer Two", "phone": "2222222222"}
              ]
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns valid count", function() {
                expect(res.body).to.have.property("total");
              });

settings:
    encodeUrl: true
