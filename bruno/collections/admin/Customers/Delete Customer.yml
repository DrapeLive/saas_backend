info:
    name: Delete Customer
    type: http
    seq: 5

http:
    method: DELETE
    url: "{{base_url}}/api/admin/customers/{{customer_id}}"
    headers:
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 204", function() {
                expect(res.status).to.equal(204);
              });

settings:
    encodeUrl: true
