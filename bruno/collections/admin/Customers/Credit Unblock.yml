info:
    name: Credit Unblock
    type: http
    seq: 11

http:
    method: POST
    url: "{{base_url}}/api/admin/customers/{{customer_id}}/credit-unblock"
    body:
        type: none
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("is_credit_blocked is false", function() {
                expect(res.body.is_credit_blocked).to.be.false;
              });

settings:
    encodeUrl: true
