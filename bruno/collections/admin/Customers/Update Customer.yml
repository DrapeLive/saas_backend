info:
    name: Update Customer
    type: http
    seq: 4

http:
    method: PATCH
    url: "{{base_url}}/api/admin/customers/{{customer_id}}"
    body:
        type: json
        data: |-
            {
              "trade_name": "Updated Customer Name",
              "internal_notes": "Updated notes for this customer",
              "credit_limit": 100000
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("trade_name updated", function() {
                expect(res.body.trade_name).to.equal("Updated Customer Name");
              });

settings:
    encodeUrl: true
