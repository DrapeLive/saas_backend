info:
    name: Suspend Agent
    type: http
    folder: Agents
    seq: 7

http:
    method: POST
    url: "{{base_url}}/api/admin/agents/{{agent_membership_id}}/suspend"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: agent_membership_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("status changed to suspended", function() {
                expect(res.body).to.have.property("status", "suspended");
              });

settings:
    encodeUrl: true
