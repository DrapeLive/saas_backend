info:
    name: Agent Performance
    type: http
    folder: Agents
    seq: 9

http:
    method: GET
    url: "{{base_url}}/api/admin/agents/{{agent_membership_id}}/performance"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: agent_membership_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns performance data", function() {
                expect(res.body).to.have.property("orders_this_month");
                expect(res.body).to.have.property("sales_this_month");
                expect(res.body).to.have.property("commission_earned");
                expect(res.body).to.have.property("leaderboard_rank");
              });

settings:
    encodeUrl: true
