info:
    name: List Agents
    type: http
    folder: Agents
    seq: 1

http:
    method: GET
    url: "{{base_url}}/api/admin/agents"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns array", function() {
                expect(Array.isArray(res.body)).to.be.true;
              });
              test("each agent has user and status", function() {
                if (res.body.length > 0) {
                  expect(res.body[0]).to.have.property("user");
                  expect(res.body[0]).to.have.property("status");
                  expect(res.body[0]).to.have.property("territory");
                }
              });

settings:
    encodeUrl: true
