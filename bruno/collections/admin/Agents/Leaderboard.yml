info:
    name: Leaderboard
    type: http
    folder: Agents
    seq: 10

http:
    method: GET
    url: "{{base_url}}/api/admin/agents/leaderboard"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns array", function() {
                expect(Array.isArray(res.body)).to.be.true;
              });

settings:
    encodeUrl: true
