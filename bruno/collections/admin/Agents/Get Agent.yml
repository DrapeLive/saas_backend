info:
    name: Get Agent
    type: http
    folder: Agents
    seq: 2

http:
    method: GET
    url: "{{base_url}}/api/admin/agents/{{agent_membership_id}}"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: agent_membership_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns agent data", function() {
                expect(res.body).to.have.property("id");
                expect(res.body).to.have.property("user");
                expect(res.body).to.have.property("status");
              });

settings:
    encodeUrl: true
