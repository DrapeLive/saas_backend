info:
    name: Reactivate Agent
    type: http
    folder: Agents
    seq: 8

http:
    method: POST
    url: "{{base_url}}/api/admin/agents/{{agent_membership_id}}/reactivate"
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: agent_membership_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("status changed to active", function() {
                expect(res.body).to.have.property("status", "active");
              });

settings:
    encodeUrl: true
