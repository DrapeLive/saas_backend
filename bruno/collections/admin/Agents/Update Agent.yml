info:
    name: Update Agent
    type: http
    folder: Agents
    seq: 3

http:
    method: PATCH
    url: "{{base_url}}/api/admin/agents/{{agent_membership_id}}"
    body:
        type: json
        data: |-
            {
              "territory": "North Zone",
              "monthly_target": "100000.00"
            }
    auth:
        type: bearer
        token: "{{auth_token}}"

runtime:
    variables:
        - name: agent_membership_id
          value: ""
    scripts:
        - type: tests
          code: |-
              test("status is 200", function() {
                expect(res.status).to.equal(200);
              });
              test("returns updated agent", function() {
                expect(res.body).to.have.property("territory", "North Zone");
              });

settings:
    encodeUrl: true
