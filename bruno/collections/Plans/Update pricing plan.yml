info:
  name: Update pricing plan
  type: http
  seq: 4
  tags:
    - Plans

http:
  method: PATCH
  url: "{{baseUrl}}/api/plans/:id/"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "tier": "free",
        "name": "",
        "description": "",
        "monthly_price": "",
        "yearly_price": "",
        "trial_days": 0,
        "max_agents": 0,
        "max_customers": 0,
        "max_products": 0,
        "max_orders_per_month": 0,
        "storage_gb": 0,
        "tally_sync_enabled": false,
        "whatsapp_enabled": false,
        "gst_verify_enabled": false,
        "analytics_advanced": false,
        "offline_mode_enabled": false,
        "api_access_enabled": false,
        "custom_domain_enabled": false,
        "dedicated_support": false,
        "is_active": false,
        "display_order": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

