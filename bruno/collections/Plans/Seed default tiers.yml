info:
  name: Seed default tiers
  type: http
  seq: 6
  tags:
    - Plans

http:
  method: POST
  url: "{{baseUrl}}/api/plans/seed-defaults/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/plans/seed-defaults/"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created": [],
            "detail": ""
          }

docs: Idempotently creates the three built-in tiers (Starter / Professional / Enterprise) if they are missing.
