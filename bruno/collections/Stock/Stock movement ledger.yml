info:
  name: Stock movement ledger
  type: http
  seq: 2
  tags:
    - Stock

http:
  method: GET
  url: "{{baseUrl}}/api/stock/movements/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/stock/movements/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "variant_size": "",
              "product_name": "",
              "color_name": "",
              "size": "",
              "movement_type": "in",
              "quantity": 0,
              "balance_after": 0,
              "reference_type": "",
              "reference_id": "",
              "reason": "",
              "performed_by_name": "",
              "created_at": ""
            }
          ]

docs: Recent stock movements (last 200), newest first.
