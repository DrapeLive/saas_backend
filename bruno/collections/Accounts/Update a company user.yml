info:
  name: Update a company user
  type: http
  seq: 5
  tags:
    - Accounts

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/users/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "full_name": "",
        "phone": "",
        "role": "superadmin",
        "company": "",
        "is_active": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
