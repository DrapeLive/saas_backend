    request:
      url: "{{baseUrl}}/api/admin/users/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "full_name": "",
            "phone": "",
            "role": "superadmin",
            "company": "",
            "is_active": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
