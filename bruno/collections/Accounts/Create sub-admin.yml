info:
  name: Create sub-admin
  type: http
  seq: 4
  tags:
    - Accounts

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": "",
        "full_name": "",
        "phone": ""
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "email": "",
            "full_name": "",
            "phone": "",
            "role": "superadmin",
            "company": "",
            "is_active": false,
            "last_login": "",
            "created_at": ""
          }
  - name: 400 Response
    description: Bad request. Field/validation errors are flattened into a single `detail` string.
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
