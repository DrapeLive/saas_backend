          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "full_name": "",
            "phone": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
