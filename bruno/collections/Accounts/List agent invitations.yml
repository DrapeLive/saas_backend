info:
  name: List agent invitations
  type: http
  seq: 1
  tags:
    - Accounts

http:
  method: GET
  url: "{{baseUrl}}/api/admin/invitations"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/invitations"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "email": "",
              "phone": "",
              "token": "",
              "status": "pending",
              "max_uses": 0,
              "used_count": 0,
              "expires_at": "",
              "created_at": ""
            }
          ]

docs: Lists the agent invitation codes created by the caller's company, newest first.
