info:
  name: List company users
  type: http
  seq: 3
  tags:
    - Accounts

http:
  method: GET
  url: "{{baseUrl}}/api/admin/users"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "email": "",
              "full_name": "",
              "phone": "",
              "role": "superadmin",
              "company": "",
              "is_active": false,
              "last_login": "",
              "created_at": ""
            }
          ]
  - name: 401 Response
    description: Unauthorized. Missing, invalid or expired bearer token.
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 403 Response
    description: Forbidden. The authenticated user is not allowed to perform this action.
    request:
      url: "{{baseUrl}}/api/admin/users"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }

docs: Lists all users (`admin`, `subadmin`, `agent`) in the caller's company.
