info:
    name: Inventory Listing - Out of Stock
    type: http
    seq: 6

http:
    method: GET
    url: "{{baseUrl}}/products/?out_of_stock=true"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("All results are out of stock (available <= 0)", function () {
                res.body.results.forEach(function (row) {
                  expect(row.stock.is_out_of_stock).to.equal(true);
                });
              });
