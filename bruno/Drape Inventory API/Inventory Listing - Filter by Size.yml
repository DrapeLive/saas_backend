info:
    name: Inventory Listing - Filter by Size
    type: http
    seq: 4

http:
    method: GET
    url: "{{baseUrl}}/products/?size=M"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("All results have size M", function () {
                res.body.results.forEach(function (row) {
                  expect(row.size).to.equal("M");
                });
              });

              test("Filters.sizes only contains M", function () {
                expect(res.body.filters.sizes).to.deep.equal(["M"]);
              });
