info:
    name: Inventory Listing - Search
    type: http
    seq: 2

http:
    method: GET
    url: "{{baseUrl}}/products/?search=shirt"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("Results contain search term in product name, SKU, color, or category", function () {
                res.body.results.forEach(function (row) {
                  const searchLower = "shirt";
                  const match =
                    row.product.name.toLowerCase().includes(searchLower) ||
                    row.sku.toLowerCase().includes(searchLower) ||
                    row.color.name.toLowerCase().includes(searchLower) ||
                    row.category.name.toLowerCase().includes(searchLower);
                  expect(match).to.equal(true);
                });
              });

              test("Pagination count reflects filtered results", function () {
                expect(res.body.count).to.be.at.least(res.body.results.length);
              });
