info:
    name: Inventory Listing - Filter by Category
    type: http
    seq: 3

http:
    method: GET
    url: "{{baseUrl}}/products/?category={{categoryId}}"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("All results belong to the requested category", function () {
                res.body.results.forEach(function (row) {
                  expect(row.category.id).to.equal(bru.getEnvVar("categoryId"));
                });
              });
