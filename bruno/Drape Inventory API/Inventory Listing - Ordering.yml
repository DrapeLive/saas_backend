info:
    name: Inventory Listing - Ordering
    type: http
    seq: 8

http:
    method: GET
    url: "{{baseUrl}}/products/?ordering=-stock_quantity"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("Results are ordered by stock_quantity descending", function () {
                for (let i = 1; i < res.body.results.length; i++) {
                  expect(res.body.results[i - 1].stock.stock_quantity).to.be.at.least(
                    res.body.results[i].stock.stock_quantity
                  );
                }
              });
