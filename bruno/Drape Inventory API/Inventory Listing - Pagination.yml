info:
    name: Inventory Listing - Pagination
    type: http
    seq: 7

http:
    method: GET
    url: "{{baseUrl}}/products/?page=1&page_size=5"
    headers:
        - name: Authorization
          value: "Bearer {{authToken}}"
        - name: accept
          value: application/json
    body:
        type: none
    auth:
        type: none

runtime:
    scripts:
        - type: tests
          code: |-
              test("Returns 200", function () {
                expect(res.status).to.equal(200);
              });

              test("Results contain at most 5 items", function () {
                expect(res.body.results.length).to.be.at.most(5);
              });

              test("Count reflects total matching rows", function () {
                expect(res.body.count).to.be.a("number");
                expect(res.body.count).to.be.at.least(res.body.results.length);
              });

              test("Next link present when more pages exist", function () {
                if (res.body.count > 5) {
                  expect(res.body.next).to.be.a("string");
                } else {
                  expect(res.body.next).to.be.null;
                }
              });

              test("Previous is null on first page", function () {
                expect(res.body.previous).to.be.null;
              });
