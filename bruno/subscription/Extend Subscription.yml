info:
  name: Extend Subscription
  type: http
  seq: 10

http:
  method: POST
  url: "{{BASE_URL}}/subscriptions/b3ecb7bd-361a-4fd2-b7f1-7a554c6475f2/extend/"
  body:
    type: json
    data: |-
      {
        "extend_days": 30,
        "notes" : "notes"
      }
  auth:
    type: bearer
    token: "{{access}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
