name: lable

x-django: &django
  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  restart: unless-stopped

  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media

  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

  networks:
    - backend


services:

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


  # Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend


  # Django migrations
  migrate:
    <<: *django

    command: python manage.py migrate --noinput

    restart: "no"


  # Django API
  web:
    <<: *django

    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn ${DJANGO_PROJECT}.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -"

    expose:
      - "8000"

    depends_on:
      migrate:
        condition: service_completed_successfully


  # Celery Worker
  celery_worker:
    <<: *django

    command: >
      celery -A ${DJANGO_PROJECT} worker
      --loglevel=info
      --concurrency=2

    depends_on:
      migrate:
        condition: service_completed_successfully


  # Celery Beat
  celery_beat:
    <<: *django

    command: >
      celery -A ${DJANGO_PROJECT} beat
      --loglevel=info
      --schedule=/var/run/celery/celerybeat-schedule

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - celerybeat_data:/var/run/celery

    depends_on:
      migrate:
        condition: service_completed_successfully


  # Nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

    depends_on:
      - web

    networks:
      - backend


volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  celerybeat_data:


networks:
  backend:
    driver: bridge
